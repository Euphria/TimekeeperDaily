# famer.py 的独立配置。图片路径相对于本 YAML 所在的 farm 目录。
ALL_THRESHOLD: &all_threshold 0.74
ALL_TIMEOUT: &all_timeout 10.0
ALL_INTERVAL: &all_interval 0.3

farmer:
  WINDOW_TITLE_KEYWORDS:
    - "MuMu模拟器"

  steps:
    - PATH: "step/1.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      CLICK_ONCE: true
    - PATH: "step/2.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      CLICK_ONCE: true
    - PATH: "step/3.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      CLICK_ONCE: true
    - PATH: "step/4.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      CLICK_ONCE: true

  replay:
    PATH: "step/replay.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
    CLICK_ONCE: true

  stop:
    PATH: "step/stop.png"
    THRESHOLD: *all_threshold
    TIMEOUT: 2.0
    INTERVAL: *all_interval

  victory:
    PATH: "step/victory.png"
    THRESHOLD: *all_threshold
    TIMEOUT: 30.0
    INTERVAL: *all_interval
    CLICK_ONCE: true
