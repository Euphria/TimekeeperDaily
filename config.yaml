# 全局参数
All_THRESHOLD: &all_threshold 0.74
ALL_TIMEOUT: &all_timeout 10.0
ALL_INTERVAL: &all_interval 0.3


core:
  launch:
    launch_keyword: "1999"
    close_keyword:  "MuMu模拟器"
  window:
    title_keywords:
      - "MuMu模拟器"
    homepage:
      PATH: "homepage.png"
      THRESHOLD: 0.55
  actions:
    CLICK_RETRY_INTERVAL: 1.0
    SCREEN_CHANGE_THRESHOLD: 0.50
    PIXEL_CHANGE_TOLERANCE: 10


tasks:

  return:
    PATH: "button/return.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
  home:
    PATH: "button/home.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval

  replay:
    PATH: "button/replay.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
  start:
    PATH: "button/start.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
  victory:
    PATH: "button/victory.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
  role:
    PATH: "role.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval

  # goto_fight:
  goto_fight:
    enter:
      PATH: "button/enter.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      resource:
        PATH: "button/enter/resource.png"
        THRESHOLD: *all_threshold
        TIMEOUT: *all_timeout
        INTERVAL: *all_interval
        PA:
          PATH: "button/enter/resource/PA.png"
          THRESHOLD: *all_threshold
          TIMEOUT: *all_timeout
          INTERVAL: *all_interval
        MA:
          PATH: "button/enter/resource/MA.png"
          THRESHOLD: *all_threshold
          TIMEOUT: *all_timeout
          INTERVAL: *all_interval
          "06":
            PATH: "button/enter/resource/MA/06.png"
            THRESHOLD: *all_threshold
            TIMEOUT: *all_timeout
            INTERVAL: *all_interval
        TP:
          PATH: "button/enter/resource/TP.png"
          THRESHOLD: *all_threshold
          TIMEOUT: *all_timeout
          INTERVAL: *all_interval
          "06":
            PATH: "button/enter/resource/TP/06.png"
            THRESHOLD: *all_threshold
            TIMEOUT: *all_timeout
            INTERVAL: *all_interval
        PA:
          PATH: "button/enter/resource/PA.png"
          THRESHOLD: *all_threshold
          TIMEOUT: *all_timeout
          INTERVAL: *all_interval
          "07":
            PATH: "button/enter/resource/PA/07.png"
            THRESHOLD: *all_threshold
            TIMEOUT: *all_timeout
            INTERVAL: *all_interval
  
  # goto_reward:
  goto_reward:
    task:
      PATH: "button/task.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
      
      # 全部领取
      claim:
        PATH: 
          - "button/task/claim_all.png"
          - "button/task/claim.png"
        THRESHOLD: *all_threshold
        TIMEOUT: 1.0
        INTERVAL: *all_interval
      # 每日活跃
      day:
        PATH: "button/task/day.png"
        THRESHOLD: *all_threshold
        TIMEOUT: 1.0
        INTERVAL: *all_interval
      # 每周活跃
      week:
        PATH: "button/task/week.png"
        THRESHOLD: *all_threshold
        TIMEOUT: 1.0
        INTERVAL: *all_interval
      # 获得物品
      obtained:
        PATH: "button/task/obtained.png"
        THRESHOLD: *all_threshold
        TIMEOUT: 3.0
        INTERVAL: *all_interval

  # goto_wilderness:
  goto_wilderness:
    PATH: "button/wilderness.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
    1:
      PATH: "button/wilderness/1.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
    2:
      PATH: "button/wilderness/2.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
    3:
      PATH: "button/wilderness/3.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval

  # goto_hoho:
  goto_hoho:
    PATH: "button/hoho.png"
    THRESHOLD: *all_threshold
    TIMEOUT: *all_timeout
    INTERVAL: *all_interval
    reward:
      PATH: "button/hoho/reward.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
    claim_all:
      PATH: "button/hoho/claim_all.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval
    thinking:
      PATH: "button/hoho/thinking.png"
      THRESHOLD: *all_threshold
      TIMEOUT: 1.0
      INTERVAL: *all_interval
    upgrade:
      PATH: "button/hoho/upgrade.png"
      THRESHOLD: *all_threshold
      TIMEOUT: *all_timeout
      INTERVAL: *all_interval

  login:
    LOGIN_TARGET:     "login.png"
    LOGIN_THRESHOLD:  *all_threshold
    LOGIN_TIMEOUT:    120.0
    LOGIN_INTERVAL:   *all_interval
